[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "proofline-sdk"
version = "1.0.1"
description = "Typed synchronous and asynchronous clients for the Proofline review API"
readme = "README.md"
license = "Apache-2.0 AND MIT"
license-files = ["LICENSE", "proofline/_generated/LICENSE"]
keywords = ["proofline", "code-review", "deployment", "sdk", "openapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "attrs>=22.2.0",
    "anyio>=4,<5",
    "httpcore==1.0.9",
    "httpx>=0.27,<0.29",
    "pydantic>=2.10,<3",
    "python-dateutil>=2.8.2,<3",
]

[project.urls]
Homepage = "https://proofline.sh"
Documentation = "https://proofline.sh/docs/sdks/"
Repository = "https://github.com/prooflinedev/sdk-python"

[project.optional-dependencies]
dev = [
    "openapi-python-client==0.29.1",
    "ruff==0.14.3",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "build==1.3.0",
    "hatchling==1.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["proofline"]

[tool.hatch.build.targets.sdist]
include = ["/openapi.public.json", "/LICENSE", "/README.md", "/proofline", "/scripts", "/templates", "/tests", "/generator.json", "/pyproject.toml", "/requirements-dev.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.per-file-target-version]
"scripts/check.py" = "py39"
"scripts/_uv.py" = "py39"

[tool.ruff.lint.per-file-ignores]
"proofline/_generated/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["dateutil.*"]
ignore_missing_imports = true
